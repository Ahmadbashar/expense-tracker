<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

  <header>
    <nav class="navbar navbar-dark  bg-dark mb-4">
      <div class="container-fluid">
        
        <span class="navbar-brand ms-5 mb-0 h1">Expense Tracker</span>
        
      </div>
    </nav>
  </header>

  <main class="container">
    <div id="alert-container" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 9999; width: 90%; max-width: 500px;"></div>
    <section id="summary-section">
       
        <div class="card text-center shadow-sm h-100">

          <div class="card-body">
            <h6 class="card-title text-muted mb-2">Total</h6>
            <div class="card-text fs-3 fw-bold" id="summary-total"></div>

          </div>
        </div>
      
      
        <div class="card text-center shadow-sm h-100">

          <div class="card-body">
            <h6 class="card-title text-muted mb-2">Number of expenses</h6>
            <div class="card-text fs-3 fw-bold" id="summary-count"></div>

          </div>
        </div>
      
      
         <div class="card text-center shadow-sm h-100">

          <div class="card-body">
            <h6 class="card-title text-muted mb-2">Highest expense</h6>
            <div class="card-text fs-3 fw-bold" id="summary-highest-amount"></div>
            <small class="text-muted d-block mt-1" id="summary-highest-title"></small>
          </div>
        </div>
      
    </section>


     <section id="chart-section" class="mb-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-4">Expenses Breakdown</h5>
          <div style="position: relative; height: 300px; width: 100%;">
            <canvas id="expensesChart"></canvas>
          </div>
        </div>
      </div>
    </section>

    
    <section id="add-expense-section" class="mb-4 ">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-4">Add expense</h5>
          <form id="add-expense-form">
            <div class="row g-3 mb-3">
              <div class="col-md-4 ">
                <label for="title" class="form-label">Title</label>
                <input type="text" name="title" id="title" class="form-control" placeholder="Lunch" required>
              </div>

              <div class="col-md-2 ">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" name="amount" id="amount" step="0.01" class="form-control" placeholder="4.50"
                  required>
              </div>

              <div class="col-md-3 ">
                <label for="category" class="form-label">Category</label>
                <select name="category" id="category" class="form-select" required>
                  <option value="" selected disabled>Choose..</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="date" class="form-label">date</label>
                <input type="date" name="date" id="date" class="form-control" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Add expense</button>
          </form>
        </div>
      </div>

    </section>

    <section id="table-section" class="mb-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-3">
            <h5 class="card-title mb-0">Expenses</h5>
            <div class="d-flex align-items-center gap-2">
              <label for="select-category" class="text-muted">Category</label>
              <select name="select-category" id="select-category" class="form-select">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>

            </div>
          </div>
          <div class="d-flex justify-content-center" >
            <input type="text" name="search-title" id="search-title" class="form-control shadow-sm" style="max-width: 500px; width: 100%;" placeholder="Search title">
          </div>
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead>
                <tr>
                  <th>Title</th>
                  <th class="text-end">Amount</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="expense-table-body">
                   
              </tbody>
            </table>
          </div>

        </div>

      </div>

    </section>
  </main>


  
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

          <form id="edit-expense-form">
            <input type="hidden" id="edit-id">

            <div class="mb-3">
              <label for="edit-title" class="form-label">Title</label>
              <input type="text" name="edit-title" id="edit-title" class="form-control" required>
            </div> 

            <div class="mb-3">
              <label for="edit-amount" class="form-label">Amount</label>
              <input type="number" name="edit-amount" id="edit-amount" step="0.01" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="edit-category" class="form-label">Category</label>
              <select name="edit-category" id="edit-category" class="form-select" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label for="edit-date" class="form-label">Date</label>
              <input type="date" name="edit-date" id="edit-date" class="form-control" required>
            </div>
            
            <div class="text-end">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div> 




  <div id="loading-spinner" class="d-none text-center my-4">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>




  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
